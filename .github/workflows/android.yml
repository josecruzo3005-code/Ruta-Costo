name: Android build
on:
  push:
    branches: ["main"]
  workflow_dispatch:
concurrency:
  group: rutacosto-android-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No generar otra firma: la caché debe existir y restaurarse.
      - uses: actions/cache@v4
        with:
          path: .ci-signing/rutacosto.keystore
          key: rutacosto-signing-keystore-v1
          fail-on-cache-miss: true
      - name: Verificar clave de firma persistente
        run: test -s .ci-signing/rutacosto.keystore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug -PORS_API_KEY="$ORS_API_KEY"
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: RutaCosto-debug
          path: app/build/outputs/apk/debug/app-debug.apk
